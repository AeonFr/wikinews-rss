name: Actualizar feeds

on:
  schedule:
    # Dos veces al día, a las 06:17 y a las 18:17 UTC (los minutos redondos están más
    # saturados en GitHub). Si nada cambió en Wikipedia, los archivos quedan idénticos y
    # no hay commit.
    - cron: "17 6,18 * * *"
  workflow_dispatch:
  # Un cambio de código o de la web vuelve a generar y a desplegar. Los commits del
  # propio bot (solo state/, feeds/ y data/) no entran en esta lista, y además un push
  # hecho con GITHUB_TOKEN no dispara otros workflows: por eso la web se construye y se
  # despliega en esta misma ejecución (job "deploy") y no en un workflow aparte.
  push:
    branches: [main]
    paths:
      - "web/**"
      - "wikipedia_rss/**"
      - "wikipedia_rss.py"
      - ".github/workflows/update-feeds.yml"

# Cada job declara los permisos que necesita.
permissions:
  contents: read

# Nunca dos ejecuciones a la vez: la siguiente espera a que termine la actual.
concurrency:
  group: update-feeds
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    outputs:
      site: ${{ steps.site.outputs.site }}
      exit_code: ${{ steps.generate.outputs.exit_code }}
    env:
      # Opcional: define la variable de repositorio WIKIPEDIA_RSS_USER_AGENT
      # (Settings > Secrets and variables > Actions > Variables) con tu contacto.
      WIKIPEDIA_RSS_USER_AGENT: ${{ vars.WIKIPEDIA_RSS_USER_AGENT }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Los tests corren aparte (tests.yml, en pull requests) para que un
      # test roto nunca impida actualizar los feeds.

      - name: Calcular la URL del sitio
        id: site
        env:
          OWNER: ${{ github.repository_owner }}
          REPO: ${{ github.event.repository.name }}
          # Opcional: variable de repositorio SITE_URL para un dominio propio
          # (URL completa de la web, con su ruta si la tiene, sin barra final).
          SITE_URL: ${{ vars.SITE_URL }}
        run: |
          owner="${OWNER,,}"   # los hostnames de Pages van en minúsculas
          if [ -n "$SITE_URL" ]; then
            site="${SITE_URL%/}"
          elif [ "${REPO,,}" = "${owner}.github.io" ]; then
            site="https://${owner}.github.io"
          else
            site="https://${owner}.github.io/${REPO}"
          fi
          echo "Site URL: $site"
          echo "site=$site" >> "$GITHUB_OUTPUT"

      - name: Generar feeds
        id: generate
        env:
          SITE: ${{ steps.site.outputs.site }}
        run: |
          # Si la generación falla, el script sale con código 1. No cortamos aquí:
          # primero se hace commit de lo que se haya escrito, luego se despliega la web
          # y el job "deploy" se marca en rojo en su último paso.
          set +e
          log="$RUNNER_TEMP/generate.log"
          python3 wikipedia_rss.py --site-url "$SITE" 2>&1 | tee "$log"
          echo "exit_code=${PIPESTATUS[0]}" >> "$GITHUB_OUTPUT"
          # Línea "ERROR wikipedia_rss: en: failed: <motivo>" para el paso de anotaciones.
          grep -E '^ERROR wikipedia_rss: [a-z-]+: failed: ' "$log" | sed -E 's/^ERROR wikipedia_rss: //' > "$RUNNER_TEMP/failed.txt" || true

      - name: Keepalive
        # GitHub desactiva los workflows programados tras 60 días sin actividad.
        # Solo se hace commit cuando hay cambios reales, así que si Wikipedia no
        # cambiara en mucho tiempo, este archivo fuerza un commit a los 45 días.
        run: |
          last=$(git log -1 --format=%ct)
          age_days=$(( ( $(date +%s) - last ) / 86400 ))
          echo "Último commit hace ${age_days} días"
          if [ "$age_days" -ge 45 ]; then
            date -u +%Y-%m-%dT%H:%M:%SZ > state/.keepalive
          fi

      - name: Commit y push
        env:
          SITE: ${{ steps.site.outputs.site }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state feeds data
          if git diff --cached --quiet; then
            echo "Sin cambios"
            exit 0
          fi
          git commit -q -m "Actualizar feeds $(date -u +%Y-%m-%dT%H:%MZ)"
          branch="${GITHUB_REF_NAME}"
          for attempt in 1 2 3 4 5; do
            if git push origin "HEAD:${branch}"; then
              exit 0
            fi
            echo "Push rechazado (intento ${attempt}); se regenera sobre lo último de la rama"
            # Nunca se fusionan a mano (rebase o merge) los archivos generados: data/news.json es
            # una lista y una fusión de texto de dos ejecuciones la deja con historias repetidas.
            # Se descarta nuestro commit, se parte de la rama remota y se vuelve a generar: el
            # estado ya incluye lo que hizo la otra ejecución.
            sleep $(( attempt * 3 ))
            git fetch -q origin "${branch}" && git reset -q --hard FETCH_HEAD || continue
            python3 wikipedia_rss.py --site-url "$SITE" || echo "La regeneración falló; se sube lo que haya"
            git add state feeds data
            if git diff --cached --quiet; then
              echo "Sin cambios tras regenerar"
              exit 0
            fi
            git commit -q -m "Actualizar feeds $(date -u +%Y-%m-%dT%H:%MZ)"
          done
          echo "::error::No se pudo hacer push tras 5 intentos"
          exit 1

      - name: Anotar los errores de la generación
        # Solo anota: el job no falla aquí para que "deploy" se ejecute igualmente
        # (hay datos del último commit); el fallo se señala al final de "deploy".
        if: steps.generate.outputs.exit_code != '0'
        run: |
          failed="$RUNNER_TEMP/failed.txt"
          if [ -s "$failed" ]; then
            while IFS= read -r line; do
              echo "::error title=Falló la generación::${line#*: failed: }"
            done < "$failed"
          fi
          echo "::error::wikipedia_rss.py terminó con código ${{ steps.generate.outputs.exit_code }} (revisa el paso 'Generar feeds')"

  deploy:
    # Construye la web Astro (web/) con los datos recién commiteados y la publica en
    # GitHub Pages. Requiere Settings > Pages > Build and deployment > Source: GitHub Actions.
    needs: update
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    env:
      SITE_URL: ${{ needs.update.outputs.site }}
    steps:
      # La rama, no el SHA del evento: así se obtiene el commit de datos que acaba de
      # subir el job "update" (y cualquier otro posterior).
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          # web/package.json pide node >=22.23.4: la última 22.x lo cumple.
          node-version: "22"
          check-latest: true
          cache: npm
          cache-dependency-path: web/package-lock.json

      - uses: actions/configure-pages@v5

      # Sin "npm test": los tests corren en tests.yml (pull requests) para que un test
      # roto nunca impida publicar una actualización de datos.
      - name: Instalar dependencias
        working-directory: web
        run: npm ci

      - name: Construir la web
        working-directory: web
        run: |
          echo "SITE_URL: $SITE_URL"
          npm run build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

      - id: deployment
        uses: actions/deploy-pages@v4

      - name: Fallar si la generación falló
        # Último paso, después del despliegue: la web ya está publicada con los datos
        # disponibles, pero el run queda en rojo para que se vea el fallo.
        if: needs.update.outputs.exit_code != '0'
        run: |
          echo "::error::La generación falló (código ${{ needs.update.outputs.exit_code }}); la web se desplegó con los datos disponibles. Revisa el job 'update'."
          exit 1
