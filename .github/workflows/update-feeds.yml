name: Actualizar feeds

on:
  schedule:
    # Dos veces al día, a las 06:17 y a las 18:17 UTC (los minutos redondos están más
    # saturados en GitHub). Si nada cambió en Wikipedia, los archivos quedan idénticos y
    # no hay commit.
    - cron: "17 6,18 * * *"
  workflow_dispatch:

permissions:
  contents: write

# Nunca dos ejecuciones a la vez: la siguiente espera a que termine la actual.
concurrency:
  group: update-feeds
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # Opcional: define la variable de repositorio WIKIPEDIA_RSS_USER_AGENT
      # (Settings > Secrets and variables > Actions > Variables) con tu contacto.
      WIKIPEDIA_RSS_USER_AGENT: ${{ vars.WIKIPEDIA_RSS_USER_AGENT }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Los tests corren aparte (tests.yml, en push y pull_request) para que un
      # test roto nunca impida actualizar los feeds.

      - name: Generar feeds
        id: generate
        env:
          OWNER: ${{ github.repository_owner }}
          REPO: ${{ github.event.repository.name }}
          # Opcional: variable de repositorio SITE_URL para un dominio propio
          # (la raíz de la web, sin barra final: la que sirve index.html).
          SITE_URL: ${{ vars.SITE_URL }}
        run: |
          owner="${OWNER,,}"   # los hostnames de Pages van en minúsculas
          if [ -n "$SITE_URL" ]; then
            site="${SITE_URL%/}"
          elif [ "${REPO,,}" = "${owner}.github.io" ]; then
            site="https://${owner}.github.io"
          else
            site="https://${owner}.github.io/${REPO}"
          fi
          echo "Site URL: $site"
          # Si la generación falla, el script sale con código 1. No cortamos aquí:
          # primero se hace commit de lo que se haya escrito y el job se marca en
          # rojo en el último paso.
          set +e
          log="$RUNNER_TEMP/generate.log"
          python3 wikipedia_rss.py --site-url "$site" 2>&1 | tee "$log"
          echo "exit_code=${PIPESTATUS[0]}" >> "$GITHUB_OUTPUT"
          # Línea "ERROR wikipedia_rss: en: failed: <motivo>" para el paso final.
          grep -E '^ERROR wikipedia_rss: [a-z-]+: failed: ' "$log" | sed -E 's/^ERROR wikipedia_rss: //' > "$RUNNER_TEMP/failed.txt" || true

      - name: Keepalive
        # GitHub desactiva los workflows programados tras 60 días sin actividad.
        # Solo se hace commit cuando hay cambios reales, así que si Wikipedia no
        # cambiara en mucho tiempo, este archivo fuerza un commit a los 45 días.
        run: |
          last=$(git log -1 --format=%ct)
          age_days=$(( ( $(date +%s) - last ) / 86400 ))
          echo "Último commit hace ${age_days} días"
          if [ "$age_days" -ge 45 ]; then
            date -u +%Y-%m-%dT%H:%M:%SZ > state/.keepalive
          fi

      - name: Commit y push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state feeds data
          if git diff --cached --quiet; then
            echo "Sin cambios"
            exit 0
          fi
          git commit -q -m "Actualizar feeds $(date -u +%Y-%m-%dT%H:%MZ)"
          branch="${GITHUB_REF_NAME}"
          for attempt in 1 2 3 4 5; do
            if git push origin "HEAD:${branch}"; then
              exit 0
            fi
            echo "Push rechazado (intento ${attempt}); rebase y reintento"
            # En un rebase, -X theirs da prioridad a nuestro commit (el que se reaplica)
            # si alguien tocó a la vez state/ o feeds/.
            git pull --rebase -X theirs origin "${branch}" || { git rebase --abort; sleep 5; }
            sleep $(( attempt * 3 ))
          done
          echo "::error::No se pudo hacer push tras 5 intentos"
          exit 1

      - name: Fallar si la generación falló
        if: steps.generate.outputs.exit_code != '0'
        env:
          EXIT_CODE: ${{ steps.generate.outputs.exit_code }}
        run: |
          failed="$RUNNER_TEMP/failed.txt"
          if [ -s "$failed" ]; then
            while IFS= read -r line; do
              echo "::error title=Falló la generación::${line#*: failed: }"
            done < "$failed"
          fi
          echo "::error::wikipedia_rss.py terminó con código ${EXIT_CODE} (revisa el paso 'Generar feeds')"
          exit 1
