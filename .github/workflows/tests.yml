name: Tests

# Separado de update-feeds.yml: un test roto marca el PR en rojo pero nunca bloquea
# la actualización programada de los feeds. Solo corre en pull requests (y a mano).
on:
  pull_request:
    paths-ignore: ["feeds/**", "state/**", "data/**"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Tests
        run: python3 -m unittest discover -s tests
